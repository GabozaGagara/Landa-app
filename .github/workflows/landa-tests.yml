name: LANDA checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supplier.html'
      - 'js/**'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/landa-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'supplier.html'
      - 'js/**'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/landa-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript syntax
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/supplier-view.mjs
          node --check js/landa-control-center.js
          node --check js/landa-local-backups.js
          node --check js/landa-receiving-core.mjs
          node --check js/landa-receiving-ui.mjs
      - name: Supplier security and accounting checks
        run: node --test tests/landa.test.mjs
      - name: D1 schema syntax and foreign keys (test only)
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('cloudflare/d1/migrations/0001_initial.sql').read_text())
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'suppliers','invoices','invoice_items','supplier_payments','payment_allocations','cash_entries','audit_events','estimate_values','sales'} <= tables
          print('D1 schema OK:', len(tables), 'tables')
          PY
